# GitHub Pages — BharatVerse playable site
# Deploys the static game (index.html + css/ + src/ + sw.js) to
# https://lk0024709-ux.github.io/Asoda-o23om/
# Runs on every push to main (i.e. after a PR is merged) and can be
# re-run manually from the Actions tab (workflow_dispatch).
name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Whole repo root is the static site: index.html, css/, src/,
          # manifest.json, sw.js, .nojekyll (legacy-udaipur-voxel/ rides along).
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
